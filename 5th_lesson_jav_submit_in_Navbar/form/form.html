<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Submission</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <main>
    <h1>Submit Your Information</h1>
    <div class="formContainer">
       <form id="userForm">
            <label for="nameInput">Name:</label>
                <input type="text" id="nameInput" placeholder="Enter Name" required>
            <label for="ageInput">Age:</label>
                <input type="number" id="ageInput" placeholder="Enter Age" required>
            <label for="cityInput">City:</label>
                <input type="text" id="cityInput" placeholder="Enter City" required>
            <label for="countryInput">Country:</label>
                <input type="text" id="countryInput" placeholder="Enter Country" required>
            <label for="emailInput">Email:</label>
                <input type="email" id="emailInput" placeholder="Enter Email" required>
            <button type="submit" id="submitBtn">Submit</button>
      </form>
        <div 
          class="result" id="resultDisplay" style="display: none;">
        </div>
    </div>
  </main>
  <script src="form.js"></script>
</body>
</html>
