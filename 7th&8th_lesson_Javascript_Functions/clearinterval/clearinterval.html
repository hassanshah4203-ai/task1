<!DOCTYPE html> 
<html lang="en">    
<head>        
    <meta charset="UTF-8">                
    <title>Clear Interval Function</title>
    <link rel="stylesheet" href="clearinterval.css">
</head>
<body>
    <h1>Clear Interval Function</h1>
    <div id="clearinterval-container">
        <p> The clearInterval() function is used to stop a timer that was previously set with setInterval(). It takes the timer ID as an argument and cancels the timer.</p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>clearInterval(timerID);</code>
    </div>
   
</html>
