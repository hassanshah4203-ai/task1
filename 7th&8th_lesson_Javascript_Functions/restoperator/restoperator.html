    <h1>Rest Operator Function</h1>
    <div id="restoperator-container">
        <p> The rest operator allows you to collect multiple elements into an array. It is represented by three dots (...) and is used in function parameters to gather all remaining arguments into an array.</p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>function myFunction(...args) { }</code>
