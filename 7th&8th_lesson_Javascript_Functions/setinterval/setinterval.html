<!DOCTYPE html> 
<html lang="en">    
<head>        
    <meta charset="UTF-8">                
    <title>Set Interval Function</title>
    <link rel="stylesheet" href="setinterval.css">
</head>
<body>
    <h1>Set Interval Function</h1>
    <div id="setinterval-container">
        <p> The setInterval() function is used to execute a function repeatedly at specified intervals. It takes a function and a delay (in milliseconds) as arguments.</p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>setInterval(function, delay);</code>
    </div>
   
</html>
