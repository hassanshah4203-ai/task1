<!DOCTYPE html> 
<html lang="en">    
<head>        
    <meta charset="UTF-8">                
    <title>Set Timeout Function</title>
    <link rel="stylesheet" href="settimeout.css">
</head>
<body>
    <h1>Set Timeout Function</h1>
    <div id="settimeout-container">
        <p> The setTimeout() function is used to execute a function once after a specified delay. It takes a function and a delay (in milliseconds) as arguments.</p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>setTimeout(function, delay);</code>
    </div>
   
</html>
