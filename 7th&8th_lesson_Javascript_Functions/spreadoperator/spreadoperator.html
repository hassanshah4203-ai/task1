<!DOCTYPE html> 
<html lang="en">    
<head>        
    <meta charset="UTF-8">                
    <title>Spread Operator Function</title>
    <link rel="stylesheet" href="spreadoperator.css">
</head>
<body>
    <h1>Spread Operator Function</h1>
    <div id="spreadoperator-container">
        <p> The spread operator allows you to expand an array or iterable into individual elements. It is represented by three dots (...) and is used to pass all elements of an array as separate arguments to a function.</p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>const newArray = [...oldArray];</code>
    </div>
   
</html>
